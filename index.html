function buildTreeShapeFromSVG(svgString) {
  const data = new SVGLoader().parse(svgString);
  const svgShape = data.paths[0].toShapes(true)[0];

  const pts = svgShape.getPoints(500);
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of pts) {
    minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
    minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
  }

  const TARGET_HEIGHT = 14.0;
  const scale = TARGET_HEIGHT / (maxY - minY);
  const cx = (minX + maxX) / 2;

  const shape = new THREE.Shape();
  const mapped = pts.map(p => [(p.x - cx) * scale, (maxY - p.y) * scale]);
  shape.moveTo(mapped[0][0], mapped[0][1]);
  for (let i = 1; i < mapped.length; i++) shape.lineTo(mapped[i][0], mapped[i][1]);
  shape.closePath();
  return shape;
}

function buildLogoTexture() {
  const H = 256;
  const margin = 60;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  ctx.font = '108px Boogaloo, "Arial Black", Impact, sans-serif';
  const titleW = ctx.measureText('BIG-ASS TREES').width;
  const W = Math.ceil(titleW + margin * 2);
  canvas.width = W; canvas.height = H;
  ctx.fillStyle = '#163d0e';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#c8a84b';
  ctx.lineWidth = 15;
  ctx.strokeRect(8, 8, W - 16, H - 16);
  ctx.lineWidth = 6;
  ctx.strokeRect(26, 26, W - 52, H - 52);
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '108px Boogaloo, "Arial Black", Impact, sans-serif';
  ctx.fillText('BIG-ASS TREES', W / 2, 105);
  ctx.strokeStyle = '#c8a84b';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(40, 160); ctx.lineTo(W - 40, 160);
  ctx.stroke();
  ctx.fillStyle = '#c8a84b';
  ctx.font = 'bold 40px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('PLAYA  FRESHENER', W / 2, 200);
  return new THREE.CanvasTexture(canvas);
}

// ─── Playa ground ─────────────────────────────────────────────────────────────
function buildPlayaGround() {
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#c8b99a';
  ctx.fillRect(0, 0, size, size);
  ctx.strokeStyle = '#a89880';
  ctx.lineWidth = 0.8;
  for (let i = 0; i < 120; i++) {
    ctx.beginPath();
    const x = Math.random() * size;
    const y = Math.random() * size;
    const len = 20 + Math.random() * 60;
    const angle = Math.random() * Math.PI;
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(angle) * len, y + Math.sin(angle) * len);
    ctx.globalAlpha = 0.3 + Math.random() * 0.4;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(20, 20);
  const geo = new THREE.PlaneGeometry(400, 400);
  const mat = new THREE.MeshLambertMaterial({ map: tex, emissive: 0x100800, emissiveIntensity: 0 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.receiveShadow = true;
  return { mesh, mat };
}

// ─── Guy wires ────────────────────────────────────────────────────────────────
function buildGuyWires(scene) {
  const group = new THREE.Group();
  const ledMarkers = [];
  const anchorCylinders = [];
  const radius = 10;
  const top = new THREE.Vector3(0, 11, 0);

  for (let i = 0; i < 6; i++) {
    const angle = (i / 6) * Math.PI * 2;
    const gx = Math.cos(angle) * radius;
    const gz = Math.sin(angle) * radius;
    const anchor = new THREE.Vector3(gx, 0, gz);

    const pts = [top, anchor];
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xaaaaaa, opacity: 0.6, transparent: true }));
    group.add(line);

    for (let j = 3; j <= 3; j++) {
      const t = j / 4;
      const pos = top.clone().lerp(anchor, t);
      const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.15, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xffff88 })
      );
      sphere.position.copy(pos);
      sphere.visible = false;
      group.add(sphere);
      ledMarkers.push(sphere);
    }

    const cylGeo = new THREE.CylinderGeometry(0.12, 0.18, 0.4, 8);
    const cylMat = new THREE.MeshLambertMaterial({ color: 0x666655 });
    const cyl = new THREE.Mesh(cylGeo, cylMat);
    cyl.position.set(gx, 0.2, gz);
    group.add(cyl);
  }

  return { group, ledMarkers };
}

// ─── Stars ────────────────────────────────────────────────────────────────────
function buildStars() {
  const count = 4000;
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.random() * Math.PI / 2;
    const r = 290 + Math.random() * 10;
    positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.cos(phi);
    positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.6, sizeAttenuation: true, fog: false });
  const stars = new THREE.Points(geo, mat);
  stars.visible = false;
  return stars;
}

// ─── Mountains ────────────────────────────────────────────────────────────────
function buildMountains() {
  const segments = 120;
  const radius = 190;

  function heightAt(angle) {
    const east  = Math.max(0, Math.cos(angle));
    const north = Math.max(0, -Math.sin(angle));
    const west  = Math.max(0, -Math.cos(angle));
    const south = Math.max(0, Math.sin(angle));
    const base = east * 30 + north * 22 + west * 18 + south * 12;
    const variation =
      Math.sin(angle * 7  + 0.3) * 4.0 +
      Math.sin(angle * 13 + 1.1) * 2.5 +
      Math.sin(angle * 19 + 0.7) * 1.5 +
      Math.sin(angle * 31 + 2.0) * 0.8;
    return Math.max(2, base + variation);
  }

  const positions = [];
  const indices = [];

  for (let i = 0; i <= segments; i++) {
    const angle = (i / segments) * Math.PI * 2;
    const x = Math.cos(angle) * radius;
    const z = Math.sin(angle) * radius;
    const h = heightAt(angle);
    positions.push(x, 0, z);
    positions.push(x, h, z);
  }

  for (let i = 0; i < segments; i++) {
    const base0 = i * 2;
    const base1 = (i + 1) * 2;
    indices.push(base0, base0 + 1, base1);
    indices.push(base1, base0 + 1, base1 + 1);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  const mat = new THREE.MeshLambertMaterial({ color: 0x9e8e7a, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat);
  return { mesh, mat };
}

  updateLogoGeometry(LOGO_H * (tex.image.width / tex.image.height));
});
const logoMesh = new THREE.Mesh(new THREE.PlaneGeometry(LOGO_W, LOGO_H), logoMat);
logoMesh.position.set(0, LOGO_CY, depth / 2 + 0.05);
logoMesh.rotation.z = 20 * Math.PI / 180;
scene.add(logoMesh);

const logoMeshBack = new THREE.Mesh(new THREE.PlaneGeometry(LOGO_W, LOGO_H), logoMat);
logoMeshBack.position.set(0, LOGO_CY, -(depth / 2 + 0.05));
logoMeshBack.rotation.y = Math.PI;
logoMeshBack.rotation.z = -20 * Math.PI / 180;
scene.add(logoMeshBack);

const logoTilt = 20 * Math.PI / 180;
const cosT = Math.cos(logoTilt), sinT = Math.sin(logoTilt);
function tiltPt(x, y, z) {
  const dy = y - LOGO_CY;
  return new THREE.Vector3(x * cosT - dy * sinT, LOGO_CY + x * sinT + dy * cosT, z);
}

const logoBorderPts = [
  tiltPt(-LOGO_W / 2, LOGO_CY - LOGO_H / 2, depth / 2 + 0.1),
  tiltPt( LOGO_W / 2, LOGO_CY - LOGO_H / 2, depth / 2 + 0.1),
  tiltPt( LOGO_W / 2, LOGO_CY + LOGO_H / 2, depth / 2 + 0.1),
  tiltPt(-LOGO_W / 2, LOGO_CY + LOGO_H / 2, depth / 2 + 0.1),
  tiltPt(-LOGO_W / 2, LOGO_CY - LOGO_H / 2, depth / 2 + 0.1),
];
const logoBorderGeo = new LineGeometry();
logoBorderGeo.setPositions(logoBorderPts.flatMap(p => [p.x, p.y, p.z]));
const logoBorderMat = new LineMaterial({
  color: 0x00ff44, linewidth: 6, transparent: true, opacity: 1,
  resolution: new THREE.Vector2(innerWidth, innerHeight)
});
const logoBorderLine = new Line2(logoBorderGeo, logoBorderMat);
logoBorderLine.visible = false;
scene.add(logoBorderLine);

const logoBorderHaloGeo = new LineGeometry();
logoBorderHaloGeo.setPositions(logoBorderPts.flatMap(p => [p.x, p.y, p.z]));
const logoBorderHaloMat = new LineMaterial({
  color: 0x00ff44, linewidth: 14, transparent: true, opacity: 0.25,
  resolution: new THREE.Vector2(innerWidth, innerHeight)
});
const logoBorderHaloLine = new Line2(logoBorderHaloGeo, logoBorderHaloMat);
logoBorderHaloLine.visible = false;
scene.add(logoBorderHaloLine);

const logoBorderBackPts = [
  tiltPt(-LOGO_W / 2, LOGO_CY - LOGO_H / 2, -(depth / 2 + 0.1)),
  tiltPt( LOGO_W / 2, LOGO_CY - LOGO_H / 2, -(depth / 2 + 0.1)),
  tiltPt( LOGO_W / 2, LOGO_CY + LOGO_H / 2, -(depth / 2 + 0.1)),
  tiltPt(-LOGO_W / 2, LOGO_CY + LOGO_H / 2, -(depth / 2 + 0.1)),
  tiltPt(-LOGO_W / 2, LOGO_CY - LOGO_H / 2, -(depth / 2 + 0.1)),
];
const logoBorderBackGeo = new LineGeometry();
logoBorderBackGeo.setPositions(logoBorderBackPts.flatMap(p => [p.x, p.y, p.z]));
const logoBorderLineBack = new Line2(logoBorderBackGeo, logoBorderMat);
logoBorderLineBack.visible = false;
scene.add(logoBorderLineBack);

const logoBorderHaloBackGeo = new LineGeometry();
logoBorderHaloBackGeo.setPositions(logoBorderBackPts.flatMap(p => [p.x, p.y, p.z]));
const logoBorderHaloLineBack = new Line2(logoBorderHaloBackGeo, logoBorderHaloMat);
logoBorderHaloLineBack.visible = false;
scene.add(logoBorderHaloLineBack);

// ─── Base platform ────────────────────────────────────────────────────────────
const platform = new THREE.Mesh(
  new THREE.BoxGeometry(8, 0.25, 8),
  new THREE.MeshLambertMaterial({ color: 0x888877 })
);
platform.position.y = -0.125;
platform.receiveShadow = true;
scene.add(platform);

// ─── Guy wires ────────────────────────────────────────────────────────────────
const { group: wireGroup, ledMarkers } = buildGuyWires(scene);
scene.add(wireGroup);

// ─── Solar panels ─────────────────────────────────────────────────────────────
scene.add(buildSolarPanels());
scene.add(buildScentDispenser());

// ─── Mist particle system ─────────────────────────────────────────────────────
const mistGeo = new THREE.BufferGeometry();
const mistMat = new THREE.PointsMaterial({
  size: 0.35, vertexColors: true, transparent: true, opacity: 0.75,
  depthWrite: false, sizeAttenuation: true
});
const mistPoints = new THREE.Points(mistGeo, mistMat);
scene.add(mistPoints);

// ─── Scent fan housing ────────────────────────────────────────────────────────
const fanHousing = new THREE.Mesh(
  new THREE.BoxGeometry(1.5, 0.8, 0.6),
  new THREE.MeshLambertMaterial({ color: 0x555555 })
);
fanHousing.position.set(0, 12.5, 0);
scene.add(fanHousing);

// ─── Ground ───────────────────────────────────────────────────────────────────
const { mesh: playaMesh, mat: playaMat } = buildPlayaGround();
scene.add(playaMesh);

// ─── Mountains ────────────────────────────────────────────────────────────────
const { mesh: mountainMesh, mat: mountainMat } = buildMountains();
scene.add(mountainMesh);

// ─── Stars ────────────────────────────────────────────────────────────────────
const stars = buildStars();
scene.add(stars);

// ─── Moon ─────────────────────────────────────────────────────────────────────
// Full white disc + sky-colored mask disc offset to carve the crescent bite.
const moonDiscShape = new THREE.Shape();
moonDiscShape.absarc(0, 0, 5, 0, Math.PI * 2, false);
const moonGeo = new THREE.ShapeGeometry(moonDiscShape, 32);
const moon = new THREE.Mesh(moonGeo,
  new THREE.MeshBasicMaterial({ color: 0xfffde0, side: THREE.DoubleSide, fog: false }));

const moonMaskShape = new THREE.Shape();
moonMaskShape.absarc(0, 0, 4.3, 0, Math.PI * 2, false);
const moonMaskGeo = new THREE.ShapeGeometry(moonMaskShape, 32);
const moonMaskMat = new THREE.MeshBasicMaterial({ color: 0x03030f, side: THREE.DoubleSide, fog: false });
const moonMask = new THREE.Mesh(moonMaskGeo, moonMaskMat);
moonMask.position.set(1.8, 0, -0.5);
moon.add(moonMask);
moon.position.set(
  285 * Math.sin(1.3) * Math.cos(0.9),
  285 * Math.cos(1.3),
  285 * Math.sin(1.3) * Math.sin(0.9)
);
moon.lookAt(0, 0, 0);
moon.visible = false;
scene.add(moon);

// ─── Day/Night state ─────────────────────────────────────────────────────────
let nightBlend = 0;
let targetBlend = 0;
const clock = new THREE.Clock();

const skyDay   = new THREE.Color(0x87ceeb);
const skyNight = new THREE.Color(0x03030f);
const fogDay   = new THREE.Color(0xc8b8a0);
const fogNight = new THREE.Color(0x150d06);
const mtDay    = new THREE.Color(0x4a3830);
const mtNight  = new THREE.Color(0x080604);

function updateDayNight(delta) {
  const speed = 0.8;
  if (nightBlend < targetBlend) {
    nightBlend = Math.min(targetBlend, nightBlend + speed * delta);
  } else if (nightBlend > targetBlend) {
    nightBlend = Math.max(targetBlend, nightBlend - speed * delta);
  }
  const t = nightBlend;

  ambientDay.intensity  = 0.6 * (1 - t);
  sunLight.intensity    = 2.0 * (1 - t);
  ambientNight.intensity = 0.20 * t;
  hemiNight.intensity   = 0.3 * t;
  playaMat.emissiveIntensity = 0.20 * t;
  moonLight.intensity   = 0.6 * t;
  moonSpot.intensity    = 1.5 * t;
  treeGlow.intensity    = 3.0 * t;
  logoMat.opacity       = 0.75 + 0.25 * t;

  scene.background = skyDay.clone().lerp(skyNight, t);
  moonMaskMat.color.copy(scene.background);
  scene.fog.color  = fogDay.clone().lerp(fogNight, t);
  mountainMat.color.copy(mtDay.clone().lerp(mtNight, t));

  const nightOn = t > 0.5;
  ledLine.visible  = nightOn;
  haloLine.visible = nightOn;
  stars.visible    = nightOn;
  moon.visible     = nightOn;
  ledMarkers.forEach(m => { m.visible = nightOn; });
  logoBorderLine.visible         = nightOn;
  logoBorderHaloLine.visible     = nightOn;
  logoBorderLineBack.visible     = nightOn;
  logoBorderHaloLineBack.visible = nightOn;
}

// ─── LED presets ──────────────────────────────────────────────────────────────
const ledModes = [
  { name: 'Green Solid', color: 0x00ff44, pattern: 'solid' },
  { name: 'Green Pulse', color: 0x00ff44, pattern: 'pulse' },
  { name: 'Blue Solid',  color: 0x00aaff, pattern: 'solid' },
  { name: 'Blue Pulse',  color: 0x00aaff, pattern: 'pulse' },
  { name: 'Red Strobe',  color: 0xff2200, pattern: 'strobe' },
  { name: 'White Solid', color: 0xffffff, pattern: 'solid' },
  { name: 'Amber Pulse', color: 0xff8800, pattern: 'pulse' },
  { name: 'Rainbow',     color: null,     pattern: 'rainbow' },
  { name: 'Loop Rainbow', color: null,    pattern: 'loop-rainbow' },
];

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

const ledOrder = ledModes.map((_, i) => i);
shuffleArray(ledOrder);
let currentLedModeIdx = 0;
{
  const initMode = ledModes[ledOrder[0]];
  if (initMode.color !== null) applyLedColor(initMode.color);
  document.getElementById('ledBtn').textContent = 'LED: ' + initMode.name;
}
let elapsedTime = 0;

function applyLedColor(hexColor) {
  ledLine.material.color.set(hexColor);
  haloLine.material.color.set(hexColor);
  treeGlow.color.set(hexColor);
  logoBorderMat.color.set(hexColor);
  logoBorderHaloMat.color.set(hexColor);
}

function updateLedPattern(t) {
  const mode = ledModes[ledOrder[currentLedModeIdx]];
  if (mode.pattern !== 'loop-rainbow') {
    ledLine.visible = true;
    haloLine.visible = true;
    rainbowLine.visible = false;
    rainbowHaloLine.visible = false;
  }
  if (mode.pattern === 'solid') {
    ledLine.material.opacity = 1;
    haloLine.material.opacity = 0.25;
    treeGlow.intensity = 3.0 * nightBlend;
  } else if (mode.pattern === 'pulse') {
    const v = 0.5 + 0.5 * Math.sin(t * 2);
    ledLine.material.opacity = v;
    haloLine.material.opacity = v * 0.25;
    treeGlow.intensity = 3 * v * nightBlend;
  } else if (mode.pattern === 'strobe') {
    const v = Math.floor(t * 8) % 2;
    ledLine.material.opacity = v;
    haloLine.material.opacity = v * 0.25;
    treeGlow.intensity = 3 * v * nightBlend;
  } else if (mode.pattern === 'rainbow') {
    const hue = (t * 0.15) % 1;
    ledLine.material.color.setHSL(hue, 1, 0.5);
    haloLine.material.color.setHSL(hue, 1, 0.5);
    treeGlow.color.setHSL(hue, 1, 0.5);
    ledLine.material.opacity = 1;
    haloLine.material.opacity = 0.25;
    treeGlow.intensity = 3.0 * nightBlend;
  } else if (mode.pattern === 'loop-rainbow') {
    ledLine.visible = false;
    haloLine.visible = false;
    rainbowLine.visible = true;
    rainbowHaloLine.visible = true;
    const colors = [];
    const c = new THREE.Color();
    for (let i = 0; i < N; i++) {
      const hue = ((i / N - t * 0.4) % 1 + 1) % 1;
      c.setHSL(hue, 1, 0.5);
      colors.push(c.r, c.g, c.b);
    }
    rainbowLineGeo.setColors(colors);
    rainbowHaloGeo.setColors(colors);
    const glowHue = ((- t * 0.4) % 1 + 1) % 1;
    treeGlow.color.setHSL(glowHue, 1, 0.5);
    treeGlow.intensity = 3.0 * nightBlend;
    logoBorderMat.color.setHSL(glowHue, 1, 0.5);
    logoBorderHaloMat.color.setHSL(glowHue, 1, 0.5);
  }
  logoBorderMat.opacity = ledLine.visible ? ledLine.material.opacity : (rainbowLine.visible ? 1 : 0);
  logoBorderHaloMat.opacity = logoBorderMat.opacity * 0.25;
  logoBorderLineBack.visible     = logoBorderLine.visible;
  logoBorderHaloLineBack.visible = logoBorderHaloLine.visible;
}

// ─── Button ───────────────────────────────────────────────────────────────────
const btn = document.getElementById('btn');
btn.addEventListener('click', () => {
  targetBlend = targetBlend === 0 ? 1 : 0;
  btn.textContent = targetBlend === 1 ? 'Day Mode' : 'Night Mode';
});

const ledBtn = document.getElementById('ledBtn');
ledBtn.addEventListener('click', () => {
  currentLedModeIdx++;
  if (currentLedModeIdx >= ledOrder.length) {
    currentLedModeIdx = 0;
    shuffleArray(ledOrder);
  }
  const mode = ledModes[ledOrder[currentLedModeIdx]];
  if (mode.color !== null) applyLedColor(mode.color);
  ledBtn.textContent = 'LED: ' + mode.name;
});

const scentBtn = document.getElementById('scentBtn');
scentBtn.addEventListener('click', () => {
  mistActive = true;
  mistEndTime = elapsedTime + 10;
  scentBtn.disabled = true;
  scentBtn.textContent = 'Dispensing...';
});

// ─── Mist state ───────────────────────────────────────────────────────────────
let mistActive = false;
let mistEndTime = 0;
const mistParticles = [];
const MAX_MIST = 300;

function updateMist(delta) {
  const scentBtn = document.getElementById('scentBtn');
  if (mistActive && elapsedTime < mistEndTime) {
    const remaining = Math.ceil(mistEndTime - elapsedTime);
    scentBtn.textContent = `Dispensing... ${remaining}s`;
    for (let i = 0; i < 4 && mistParticles.length < MAX_MIST; i++) {
      const maxLife = 2.0 + Math.random() * 1.5;
      mistParticles.push({
        pos: new THREE.Vector3(
          (Math.random() - 0.5) * 0.3,
          1.05,
          -3.5 + (Math.random() - 0.5) * 0.3
        ),
        vel: new THREE.Vector3(
          (Math.random() - 0.5) * 0.3,
          0.5 + Math.random() * 0.5,
          (Math.random() - 0.5) * 0.3
        ),
        life: maxLife,
        maxLife
      });
    }
  }
  for (let i = mistParticles.length - 1; i >= 0; i--) {
    const p = mistParticles[i];
    p.pos.addScaledVector(p.vel, delta);
    p.life -= delta;
    if (p.life <= 0) mistParticles.splice(i, 1);
  }
  if (mistParticles.length > 0) {
    const positions = new Float32Array(mistParticles.length * 3);
    const colors = new Float32Array(mistParticles.length * 3);
    for (let i = 0; i < mistParticles.length; i++) {
      const p = mistParticles[i];
      positions[i * 3]     = p.pos.x;
      positions[i * 3 + 1] = p.pos.y;
      positions[i * 3 + 2] = p.pos.z;
      const b = p.life / p.maxLife;
      colors[i * 3] = b; colors[i * 3 + 1] = b; colors[i * 3 + 2] = b;
    }
    mistGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    mistGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  } else {
    mistGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(0), 3));
    mistGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(0), 3));
  }
  if (mistActive && elapsedTime >= mistEndTime && mistParticles.length === 0) {
    mistActive = false;
    scentBtn.disabled = false;
    scentBtn.textContent = 'Dispense Scent';
  }
}

// ─── Animate ──────────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  elapsedTime += delta;
  updateDayNight(delta);
  updateLedPattern(elapsedTime);
  updateMist(delta);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  ledLine.material.resolution.set(innerWidth, innerHeight);
  haloLine.material.resolution.set(innerWidth, innerHeight);
  rainbowLine.material.resolution.set(innerWidth, innerHeight);
  rainbowHaloLine.material.resolution.set(innerWidth, innerHeight);
});

animate();
</script>
