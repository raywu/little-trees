<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Trees — Burning Man 2026</title>
<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.169.0",
    "three/addons/": "https://esm.sh/three@0.169.0/examples/jsm/"
  }
}
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; }
canvas { display: block; }
#btn {
  position: fixed;
  top: 16px;
  right: 16px;
  padding: 8px 16px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 4px;
  cursor: pointer;
  font-family: monospace;
  font-size: 14px;
  z-index: 10;
}
#btn:hover { background: rgba(255,255,255,0.15); }
#ledBtn {
  position: fixed;
  top: 54px;
  right: 16px;
  padding: 8px 16px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 4px;
  cursor: pointer;
  font-family: monospace;
  font-size: 14px;
  z-index: 10;
}
#ledBtn:hover { background: rgba(255,255,255,0.15); }
#label {
  position: fixed;
  bottom: 16px;
  left: 16px;
  color: rgba(255,255,255,0.5);
  font-family: monospace;
  font-size: 12px;
  z-index: 10;
}
</style>
</head>
<body>
<button id="btn">Night Mode</button>
<button id="ledBtn">LED: ...</button>
<div id="label">Little Trees · Black Rock Desert · 2026</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

// ─── Tree shape ───────────────────────────────────────────────────────────────
function buildTreeShape() {
  const shape = new THREE.Shape();
  const pts = [
    [-0.5, 0], [0.5, 0], [0.5, 4],
    [3.5, 4], [3.5, 6.5], [2.0, 6.5],
    [2.5, 7.0], [2.5, 9.5], [1.25, 9.5],
    [1.5, 10.0], [1.5, 12.0], [0.0, 14.0],
    [-1.5, 12.0], [-1.5, 10.0], [-1.25, 9.5],
    [-2.5, 9.5], [-2.5, 7.0], [-2.0, 6.5],
    [-3.5, 6.5], [-3.5, 4.0], [-0.5, 4.0]
  ];
  shape.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) shape.lineTo(pts[i][0], pts[i][1]);
  shape.closePath();
  return shape;
}

// ─── Playa ground ─────────────────────────────────────────────────────────────
function buildPlayaGround() {
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#c8b99a';
  ctx.fillRect(0, 0, size, size);
  ctx.strokeStyle = '#a89880';
  ctx.lineWidth = 0.8;
  for (let i = 0; i < 120; i++) {
    ctx.beginPath();
    const x = Math.random() * size;
    const y = Math.random() * size;
    const len = 20 + Math.random() * 60;
    const angle = Math.random() * Math.PI;
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(angle) * len, y + Math.sin(angle) * len);
    ctx.globalAlpha = 0.3 + Math.random() * 0.4;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(20, 20);
  const geo = new THREE.PlaneGeometry(400, 400);
  const mat = new THREE.MeshLambertMaterial({ map: tex, emissive: 0x100800, emissiveIntensity: 0 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.receiveShadow = true;
  return { mesh, mat };
}

// ─── Guy wires ────────────────────────────────────────────────────────────────
function buildGuyWires(scene) {
  const group = new THREE.Group();
  const ledMarkers = [];
  const anchorCylinders = [];
  const radius = 10;
  const top = new THREE.Vector3(0, 11, 0);

  for (let i = 0; i < 6; i++) {
    const angle = (i / 6) * Math.PI * 2;
    const gx = Math.cos(angle) * radius;
    const gz = Math.sin(angle) * radius;
    const anchor = new THREE.Vector3(gx, 0, gz);

    const pts = [top, anchor];
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xaaaaaa, opacity: 0.6, transparent: true }));
    group.add(line);

    for (let j = 3; j <= 3; j++) {
      const t = j / 4;
      const pos = top.clone().lerp(anchor, t);
      const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.15, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xffff88 })
      );
      sphere.position.copy(pos);
      sphere.visible = false;
      group.add(sphere);
      ledMarkers.push(sphere);
    }

    const cylGeo = new THREE.CylinderGeometry(0.12, 0.18, 0.4, 8);
    const cylMat = new THREE.MeshLambertMaterial({ color: 0x666655 });
    const cyl = new THREE.Mesh(cylGeo, cylMat);
    cyl.position.set(gx, 0.2, gz);
    group.add(cyl);
  }

  return { group, ledMarkers };
}

// ─── Solar panels ─────────────────────────────────────────────────────────────
function buildSolarPanels() {
  const group = new THREE.Group();
  const geo = new THREE.BoxGeometry(3.28, 0.08, 1.64);
  const mat = new THREE.MeshLambertMaterial({ color: 0x1a1a3a });
  [-1.8, 1.8].forEach(x => {
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, 0.8, 4.5);
    mesh.rotation.x = -Math.PI / 6;
    mesh.castShadow = true;
    group.add(mesh);
  });
  return group;
}

// ─── Stars ────────────────────────────────────────────────────────────────────
function buildStars() {
  const count = 4000;
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.random() * Math.PI / 2;
    const r = 290 + Math.random() * 10;
    positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.cos(phi);
    positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.6, sizeAttenuation: true, fog: false });
  const stars = new THREE.Points(geo, mat);
  stars.visible = false;
  return stars;
}

// ─── Scene / renderer / camera ────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0xc8b8a0, 50, 300);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(12, 8, 22);
camera.lookAt(0, 6, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 6, 0);
controls.minDistance = 5;
controls.maxDistance = 100;
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// ─── Lighting ─────────────────────────────────────────────────────────────────
const ambientDay = new THREE.AmbientLight(0xfff4e0, 0.6);
scene.add(ambientDay);

const sunLight = new THREE.DirectionalLight(0xfff4cc, 2.0);
sunLight.position.set(30, 50, 20);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 200;
sunLight.shadow.camera.left = -20;
sunLight.shadow.camera.right = 20;
sunLight.shadow.camera.top = 20;
sunLight.shadow.camera.bottom = -20;
scene.add(sunLight);

const ambientNight = new THREE.AmbientLight(0x111133, 0.0);
scene.add(ambientNight);

const hemiNight = new THREE.HemisphereLight(0x050a14, 0x1a0d00, 0.0);
scene.add(hemiNight);

const treeGlow = new THREE.PointLight(0x00ff44, 0.0, 40);
treeGlow.position.set(0, 7, 1);
scene.add(treeGlow);

const moonLight = new THREE.DirectionalLight(0xcce4ff, 0.0);
moonLight.position.set(
  Math.sin(1.45) * Math.cos(0.9),
  Math.cos(1.45),
  Math.sin(1.45) * Math.sin(0.9)
);
scene.add(moonLight);

// ─── Tree ─────────────────────────────────────────────────────────────────────
const treeShape = buildTreeShape();
const depth = 5 / 12;
const extrudeGeo = new THREE.ExtrudeGeometry(treeShape, {
  depth,
  bevelEnabled: false
});
extrudeGeo.translate(0, 0, -depth / 2);
const treeMesh = new THREE.Mesh(
  extrudeGeo,
  new THREE.MeshLambertMaterial({ color: 0x2d5a1b, side: THREE.DoubleSide })
);
treeMesh.castShadow = true;
scene.add(treeMesh);

// LED perimeter outline
const perimPts = treeShape.getPoints(64);
perimPts.push(perimPts[0].clone());
const perimPts3 = perimPts.map(p => new THREE.Vector3(p.x, p.y, 0));
const lineGeo = new LineGeometry();
lineGeo.setPositions(perimPts3.flatMap(p => [p.x, p.y, p.z]));
const ledLine = new Line2(lineGeo, new LineMaterial({
  color: 0x00ff44, linewidth: 6, transparent: true, opacity: 1,
  resolution: new THREE.Vector2(innerWidth, innerHeight)
}));
ledLine.visible = false;
scene.add(ledLine);

const haloLineGeo = new LineGeometry();
haloLineGeo.setPositions(perimPts3.flatMap(p => [p.x * 1.02, p.y * 1.02, p.z]));
const haloLine = new Line2(haloLineGeo, new LineMaterial({
  color: 0x00ff44, linewidth: 14, opacity: 0.25, transparent: true,
  resolution: new THREE.Vector2(innerWidth, innerHeight)
}));
haloLine.position.z = 0.01;
haloLine.visible = false;
scene.add(haloLine);

const N = perimPts3.length;

const rainbowLineGeo = new LineGeometry();
rainbowLineGeo.setPositions(perimPts3.flatMap(p => [p.x, p.y, p.z]));
rainbowLineGeo.setColors(new Array(N * 3).fill(1));
const rainbowLine = new Line2(rainbowLineGeo, new LineMaterial({
  vertexColors: true, linewidth: 6, transparent: true, opacity: 1,
  resolution: new THREE.Vector2(innerWidth, innerHeight)
}));
rainbowLine.visible = false;
scene.add(rainbowLine);

const rainbowHaloGeo = new LineGeometry();
rainbowHaloGeo.setPositions(perimPts3.flatMap(p => [p.x * 1.02, p.y * 1.02, p.z]));
rainbowHaloGeo.setColors(new Array(N * 3).fill(1));
const rainbowHaloLine = new Line2(rainbowHaloGeo, new LineMaterial({
  vertexColors: true, linewidth: 14, transparent: true, opacity: 0.25,
  resolution: new THREE.Vector2(innerWidth, innerHeight)
}));
rainbowHaloLine.position.z = 0.01;
rainbowHaloLine.visible = false;
scene.add(rainbowHaloLine);

// ─── Base platform ────────────────────────────────────────────────────────────
const platform = new THREE.Mesh(
  new THREE.BoxGeometry(8, 0.25, 8),
  new THREE.MeshLambertMaterial({ color: 0x888877 })
);
platform.position.y = -0.125;
platform.receiveShadow = true;
scene.add(platform);

// ─── Guy wires ────────────────────────────────────────────────────────────────
const { group: wireGroup, ledMarkers } = buildGuyWires(scene);
scene.add(wireGroup);

// ─── Solar panels ─────────────────────────────────────────────────────────────
scene.add(buildSolarPanels());

// ─── Scent fan housing ────────────────────────────────────────────────────────
const fanHousing = new THREE.Mesh(
  new THREE.BoxGeometry(1.5, 0.8, 0.6),
  new THREE.MeshLambertMaterial({ color: 0x555555 })
);
fanHousing.position.set(0, 12.5, 0);
scene.add(fanHousing);

// ─── Ground ───────────────────────────────────────────────────────────────────
const { mesh: playaMesh, mat: playaMat } = buildPlayaGround();
scene.add(playaMesh);

// ─── Stars ────────────────────────────────────────────────────────────────────
const stars = buildStars();
scene.add(stars);

// ─── Moon ─────────────────────────────────────────────────────────────────────
// Full white disc + sky-colored mask disc offset to carve the crescent bite.
const moonDiscShape = new THREE.Shape();
moonDiscShape.absarc(0, 0, 5, 0, Math.PI * 2, false);
const moonGeo = new THREE.ShapeGeometry(moonDiscShape, 32);
const moon = new THREE.Mesh(moonGeo,
  new THREE.MeshBasicMaterial({ color: 0xfffde0, side: THREE.DoubleSide, fog: false }));

const moonMaskShape = new THREE.Shape();
moonMaskShape.absarc(0, 0, 4.3, 0, Math.PI * 2, false);
const moonMaskGeo = new THREE.ShapeGeometry(moonMaskShape, 32);
const moonMaskMat = new THREE.MeshBasicMaterial({ color: 0x03030f, side: THREE.DoubleSide, fog: false });
const moonMask = new THREE.Mesh(moonMaskGeo, moonMaskMat);
moonMask.position.set(1.8, 0, -0.5);
moon.add(moonMask);
moon.position.set(
  285 * Math.sin(1.45) * Math.cos(0.9),
  285 * Math.cos(1.45),
  285 * Math.sin(1.45) * Math.sin(0.9)
);
moon.lookAt(0, 0, 0);
moon.visible = false;
scene.add(moon);

// ─── Day/Night state ─────────────────────────────────────────────────────────
let nightBlend = 0;
let targetBlend = 0;
const clock = new THREE.Clock();

const skyDay   = new THREE.Color(0x87ceeb);
const skyNight = new THREE.Color(0x03030f);
const fogDay   = new THREE.Color(0xc8b8a0);
const fogNight = new THREE.Color(0x150d06);

function updateDayNight(delta) {
  const speed = 0.8;
  if (nightBlend < targetBlend) {
    nightBlend = Math.min(targetBlend, nightBlend + speed * delta);
  } else if (nightBlend > targetBlend) {
    nightBlend = Math.max(targetBlend, nightBlend - speed * delta);
  }
  const t = nightBlend;

  ambientDay.intensity  = 0.6 * (1 - t);
  sunLight.intensity    = 2.0 * (1 - t);
  ambientNight.intensity = 0.20 * t;
  hemiNight.intensity   = 0.3 * t;
  playaMat.emissiveIntensity = 0.20 * t;
  moonLight.intensity   = 0.6 * t;
  treeGlow.intensity    = 3.0 * t;

  scene.background = skyDay.clone().lerp(skyNight, t);
  moonMaskMat.color.copy(scene.background);
  scene.fog.color  = fogDay.clone().lerp(fogNight, t);

  const nightOn = t > 0.5;
  ledLine.visible  = nightOn;
  haloLine.visible = nightOn;
  stars.visible    = nightOn;
  moon.visible     = nightOn;
  ledMarkers.forEach(m => { m.visible = nightOn; });
}

// ─── LED presets ──────────────────────────────────────────────────────────────
const ledModes = [
  { name: 'Green Solid', color: 0x00ff44, pattern: 'solid' },
  { name: 'Green Pulse', color: 0x00ff44, pattern: 'pulse' },
  { name: 'Blue Solid',  color: 0x00aaff, pattern: 'solid' },
  { name: 'Blue Pulse',  color: 0x00aaff, pattern: 'pulse' },
  { name: 'Red Strobe',  color: 0xff2200, pattern: 'strobe' },
  { name: 'White Solid', color: 0xffffff, pattern: 'solid' },
  { name: 'Amber Pulse', color: 0xff8800, pattern: 'pulse' },
  { name: 'Rainbow',     color: null,     pattern: 'rainbow' },
  { name: 'Loop Rainbow', color: null,    pattern: 'loop-rainbow' },
];

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

const ledOrder = ledModes.map((_, i) => i);
shuffleArray(ledOrder);
let currentLedModeIdx = 0;
{
  const initMode = ledModes[ledOrder[0]];
  if (initMode.color !== null) applyLedColor(initMode.color);
  document.getElementById('ledBtn').textContent = 'LED: ' + initMode.name;
}
let elapsedTime = 0;

function applyLedColor(hexColor) {
  ledLine.material.color.set(hexColor);
  haloLine.material.color.set(hexColor);
  treeGlow.color.set(hexColor);
}

function updateLedPattern(t) {
  const mode = ledModes[ledOrder[currentLedModeIdx]];
  if (mode.pattern !== 'loop-rainbow') {
    ledLine.visible = true;
    haloLine.visible = true;
    rainbowLine.visible = false;
    rainbowHaloLine.visible = false;
  }
  if (mode.pattern === 'solid') {
    ledLine.material.opacity = 1;
    haloLine.material.opacity = 0.25;
    treeGlow.intensity = 3.0 * nightBlend;
  } else if (mode.pattern === 'pulse') {
    const v = 0.5 + 0.5 * Math.sin(t * 2);
    ledLine.material.opacity = v;
    haloLine.material.opacity = v * 0.25;
    treeGlow.intensity = 3 * v * nightBlend;
  } else if (mode.pattern === 'strobe') {
    const v = Math.floor(t * 8) % 2;
    ledLine.material.opacity = v;
    haloLine.material.opacity = v * 0.25;
    treeGlow.intensity = 3 * v * nightBlend;
  } else if (mode.pattern === 'rainbow') {
    const hue = (t * 0.15) % 1;
    ledLine.material.color.setHSL(hue, 1, 0.5);
    haloLine.material.color.setHSL(hue, 1, 0.5);
    treeGlow.color.setHSL(hue, 1, 0.5);
    ledLine.material.opacity = 1;
    haloLine.material.opacity = 0.25;
    treeGlow.intensity = 3.0 * nightBlend;
  } else if (mode.pattern === 'loop-rainbow') {
    ledLine.visible = false;
    haloLine.visible = false;
    rainbowLine.visible = true;
    rainbowHaloLine.visible = true;
    const colors = [];
    const c = new THREE.Color();
    for (let i = 0; i < N; i++) {
      const hue = ((i / N - t * 0.4) % 1 + 1) % 1;
      c.setHSL(hue, 1, 0.5);
      colors.push(c.r, c.g, c.b);
    }
    rainbowLineGeo.setColors(colors);
    rainbowHaloGeo.setColors(colors);
    const glowHue = ((- t * 0.4) % 1 + 1) % 1;
    treeGlow.color.setHSL(glowHue, 1, 0.5);
    treeGlow.intensity = 3.0 * nightBlend;
  }
}

// ─── Button ───────────────────────────────────────────────────────────────────
const btn = document.getElementById('btn');
btn.addEventListener('click', () => {
  targetBlend = targetBlend === 0 ? 1 : 0;
  btn.textContent = targetBlend === 1 ? 'Day Mode' : 'Night Mode';
});

const ledBtn = document.getElementById('ledBtn');
ledBtn.addEventListener('click', () => {
  currentLedModeIdx++;
  if (currentLedModeIdx >= ledOrder.length) {
    currentLedModeIdx = 0;
    shuffleArray(ledOrder);
  }
  const mode = ledModes[ledOrder[currentLedModeIdx]];
  if (mode.color !== null) applyLedColor(mode.color);
  ledBtn.textContent = 'LED: ' + mode.name;
});

// ─── Animate ──────────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  elapsedTime += delta;
  updateDayNight(delta);
  updateLedPattern(elapsedTime);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  ledLine.material.resolution.set(innerWidth, innerHeight);
  haloLine.material.resolution.set(innerWidth, innerHeight);
  rainbowLine.material.resolution.set(innerWidth, innerHeight);
  rainbowHaloLine.material.resolution.set(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
